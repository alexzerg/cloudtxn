apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: cloudtxn}
            - {name: POSTGRES_USER, value: cloudtxn}
            - {name: POSTGRES_PASSWORD, value: cloudtxn}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "cloudtxn"]}
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-api}
  template:
    metadata:
      labels: {app: payment-api}
    spec:
      containers:
        - name: payment-api
          image: cloudtxn-payment-lab:demo
          imagePullPolicy: Never
          env:
            - name: PAYMENT_DATABASE_URL
              value: postgresql://cloudtxn:cloudtxn@postgres:5432/cloudtxn
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /customer, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  type: NodePort
  selector: {app: payment-api}
  ports:
    - {port: 8080, targetPort: 8080, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-reconciler
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-reconciler}
  template:
    metadata:
      labels: {app: payment-reconciler}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: payment-reconciler
          image: cloudtxn-payment-lab:demo
          imagePullPolicy: Never
          command: ["python", "-m", "payment_lab.reconciler"]
          env:
            - name: PAYMENT_DATABASE_URL
              value: postgresql://cloudtxn:cloudtxn@postgres:5432/cloudtxn
